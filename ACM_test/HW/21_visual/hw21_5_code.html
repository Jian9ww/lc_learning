<script>
(function(){
const CAPTURE=/capture/.test(location.search);
if(CAPTURE)document.body.classList.add('capture');

/* ---------- 小工具 ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eout=x=>1-Math.pow(1-x,3);
const pr=(t,a,b)=>clamp((t-a)/(b-a));
const ep=(t,a,b)=>ease(pr(t,a,b));
const lerp=(a,b,p)=>a+(b-a)*p;
const INK=[27,38,49],BLUE=[36,81,196],GRAY=[175,183,189];
const mix=(a,b,p)=>`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*p)).join(',')})`;
const NOPX={opacity:1,zIndex:1,fontWeight:1,lineHeight:1,flex:1};
function H(tag,cls,css,parent,html){
  const e=document.createElement(tag);if(cls)e.className=cls;
  if(css)for(const k in css)e.style[k]=(typeof css[k]==='number'&&!NOPX[k])?css[k]+'px':css[k];
  if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e;
}
const SVGNS='http://www.w3.org/2000/svg';
function S(tag,attrs,parent,text){
  const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);
  if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e;
}
function vis(e,a,dy=0,dx=0){e.style.opacity=a;e.style.transform=(dy||dx)?`translate(${(1-a)*dx}px,${(1-a)*dy}px)`:'';}
function pop(e,a){e.style.opacity=a;e.style.transform=`scale(${.82+.18*a})`;}
function drawable(el){
  const len=el.getTotalLength();el.style.strokeDasharray=len+' '+(len+4);el.style.strokeDashoffset=len;
  return {el,len,set(p){el.style.strokeDashoffset=len*(1-p);el.style.opacity=p>0?1:0;}};
}
// 手画的红笔圈：略微超过一圈、带一点倾斜
function penCircle(g,cx,cy,a,b,color,w=3.2,rot=-9){
  let d='',len=0,px=0,py=0;const n=72,turns=1.1,r=rot*Math.PI/180;
  for(let k=0;k<=n;k++){
    const th=-Math.PI*.62+k/n*turns*2*Math.PI,gr=1+.07*k/n;
    const x=a*gr*Math.cos(th),y=b*gr*Math.sin(th);
    const X=cx+x*Math.cos(r)-y*Math.sin(r),Y=cy+x*Math.sin(r)+y*Math.cos(r);
    d+=(k?'L':'M')+X.toFixed(1)+' '+Y.toFixed(1);if(k)len+=Math.hypot(X-px,Y-py);px=X;py=Y;
  }
  const el=S('path',{d,fill:'none'},g);
  Object.assign(el.style,{stroke:color,strokeWidth:w,strokeLinecap:'round',strokeLinejoin:'round',strokeDasharray:len+' '+(len+4),strokeDashoffset:len,opacity:0});
  return {el,len,set(p){el.style.strokeDashoffset=len*(1-p);el.style.opacity=p>0?1:0;}};
}
// 方括号：一条括号 = 一段子数组
function bracket(svg,x1,x2,y,color,label,dir=1,fs=20){
  const g=S('g',{},svg);
  const p=S('path',{d:`M${x1} ${y-8*dir} L${x1} ${y} L${x2} ${y} L${x2} ${y-8*dir}`,fill:'none'},g);
  Object.assign(p.style,{stroke:color,strokeWidth:3.5,strokeLinecap:'round',strokeLinejoin:'round'});
  const d=drawable(p);let tx=null;
  if(label){tx=S('text',{x:x2+12,y:y+7,class:'halo'},g,label);tx.style.fill=color;tx.style.fontSize=fs+'px';tx.style.opacity=0;}
  return {g,d,t:tx,set(pp,lp=pp){d.set(pp);if(tx)tx.style.opacity=lp;}};
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const KW=/\b(int|for|while|if|return|auto|unordered_map|vector)\b/g;
function codePanel(r,x,y,lines,fs,lh,title){
  const box=H('div','code',{left:x,top:y,fontSize:fs,lineHeight:lh+'px'},r);
  if(title)H('div','code-title',null,box,title);
  const hl=H('div','code-hl',{height:lh},box);
  const els=lines.map(l=>H('div','cl',null,box,l?esc(l).replace(KW,'<span class="kw">$1</span>'):' '));
  let cur;
  return {box,els,set(i){
    if(i===cur)return;cur=i;
    if(i==null){hl.style.opacity=0;}else{hl.style.opacity=.95;hl.style.top=els[i].offsetTop+'px';}
  }};
}

/* =====================================================================
   HW21 核心路由器管理域规划（Bi-K-means）：四集动画共用的部分
   第一部分是算法模拟：和 ACM_test/HW/21.cpp 的逻辑逐句对应，另外把中间过程都记下来，
   动画里的每个数字都来自这里，不是手填的。
   第二部分是画图用的小工具。
   ===================================================================== */

/* ---------- 算法模拟（对应 21.cpp） ---------- */
// 对应 getSSENumerator：返回 n × SSE（整数，用 BigInt 保证精确）
function hwSseNum(pts){
  const n=BigInt(pts.length);let sx=0n,sy=0n,sq=0n;
  for(const p of pts){sx+=BigInt(p.x);sy+=BigInt(p.y);sq+=BigInt(p.x*p.x+p.y*p.y);}
  return sq*n-sx*sx-sy*sy;
}
// 对应 splitCluster：对一个簇做 K = 2 的 K-means。iters 里记下每一轮循环的全部中间量
function hwSplit(pts,br){
  const res={valid:false,iters:[]},n=pts.length;
  if(n<2){br.split_lt2++;return res;}
  let mi=0,ma=0;
  for(let i=1;i<n;i++){
    if(pts[i].x<pts[mi].x)mi=i;
    if(pts[i].x>pts[ma].x)ma=i;
  }
  res.minIndex=mi;res.maxIndex=ma;
  let c0={x:pts[mi].x,y:pts[mi].y},c1={x:pts[ma].x,y:pts[ma].y};
  let belong=new Array(n).fill(-1);
  while(true){
    const nb=new Array(n),d0s=[],d1s=[];
    for(let i=0;i<n;i++){
      const dx0=pts[i].x-c0.x,dy0=pts[i].y-c0.y,dx1=pts[i].x-c1.x,dy1=pts[i].y-c1.y;
      const d0=dx0*dx0+dy0*dy0,d1=dx1*dx1+dy1*dy1;
      d0s.push(d0);d1s.push(d1);
      if(d0<=d1){nb[i]=0;br[d0===d1?'assign_tie':'assign_0']++;}else{nb[i]=1;br.assign_1++;}
    }
    let same=true;
    for(let i=0;i<n;i++)if(belong[i]!==nb[i]){same=false;break;}
    let sx0=0,sy0=0,sx1=0,sy1=0,cnt0=0,cnt1=0;
    for(let i=0;i<n;i++){
      if(nb[i]===0){sx0+=pts[i].x;sy0+=pts[i].y;cnt0++;}else{sx1+=pts[i].x;sy1+=pts[i].y;cnt1++;}
    }
    if(cnt0===0||cnt1===0){br.empty_cluster++;return res;}
    const nc0={x:sx0/cnt0,y:sy0/cnt0},nc1={x:sx1/cnt1,y:sy1/cnt1};
    const move0=Math.hypot(nc0.x-c0.x,nc0.y-c0.y),move1=Math.hypot(nc1.x-c1.x,nc1.y-c1.y),maxMove=Math.max(move0,move1);
    const stop=same||maxMove<1e-6;
    res.iters.push({c0,c1,d0s,d1s,nb,prev:belong,same,cnt0,cnt1,sx0,sy0,sx1,sy1,nc0,nc1,move0,move1,maxMove,stop});
    belong=nb;c0=nc0;c1=nc1;
    if(stop){br[same?'stop_same':'stop_move']++;break;}
    br.loop_again++;
  }
  res.belong=belong;res.c0=c0;res.c1=c1;
  res.child0=pts.filter((p,i)=>belong[i]===0);res.child1=pts.filter((p,i)=>belong[i]===1);
  const pn=BigInt(n),n0=BigInt(res.child0.length),n1=BigInt(res.child1.length);
  res.parentNum=hwSseNum(pts);res.child0Num=hwSseNum(res.child0);res.child1Num=hwSseNum(res.child1);
  res.gradNum=res.parentNum*n0*n1-res.child0Num*pn*n1-res.child1Num*pn*n0;
  res.gradDen=pn*n0*n1;
  res.sseP=Number(res.parentNum)/n;res.sse0=Number(res.child0Num)/res.child0.length;res.sse1=Number(res.child1Num)/res.child1.length;
  res.grad=Number(res.gradNum)/Number(res.gradDen);
  res.valid=true;
  return res;
}
// 对应 compareGrad：交叉相乘比较两个分数
function hwCmp(a,b){const l=a.gradNum*b.gradDen,r=b.gradNum*a.gradDen;return l>r?1:l<r?-1:0;}
const hwSizes=cl=>cl.map(c=>c.pts.length).sort((a,b)=>b-a);
// 对应 main：返回每一轮的簇列表、每个候选的试拆结果、比较动作和输出
function hwRun(N,points){
  const br={split_lt2:0,assign_0:0,assign_tie:0,assign_1:0,empty_cluster:0,stop_same:0,stop_move:0,loop_again:0,
    skip_single:0,invalid:0,first:0,bigger:0,smaller:0,tie_size:0,tie_birth:0,tie_keep:0,no_candidate:0,split_done:0,loop_not_entered:0};
  const pts=points.map((p,i)=>({x:p[0],y:p[1],id:i}));
  let clusters=[{pts,birth:0}],birthCounter=1;
  const out=[hwSizes(clusters)],rounds=[];
  if(!(clusters.length<N))br.loop_not_entered++;
  while(clusters.length<N){
    let best=-1,bestSplit=null;const cands=[];
    for(let i=0;i<clusters.length;i++){
      if(clusters[i].pts.length<2){br.skip_single++;cands.push({i,act:'skip_single'});continue;}
      const cs=hwSplit(clusters[i].pts,br);
      if(!cs.valid){br.invalid++;cands.push({i,act:'invalid'});continue;}
      if(best===-1){best=i;bestSplit=cs;br.first++;cands.push({i,split:cs,act:'first'});continue;}
      const cmp=hwCmp(cs,bestSplit),vs=best;let act;
      if(cmp>0){best=i;bestSplit=cs;act='bigger';}
      else if(cmp===0){
        const curSize=clusters[i].pts.length,bestSize=clusters[best].pts.length;
        if(curSize>bestSize){best=i;bestSplit=cs;act='tie_size';}
        else if(curSize===bestSize&&clusters[i].birth<clusters[best].birth){best=i;bestSplit=cs;act='tie_birth';}
        else act='tie_keep';
      }else act='smaller';
      br[act]++;cands.push({i,split:cs,act,cmp,vs});
    }
    const before=clusters.slice();
    if(best===-1){br.no_candidate++;rounds.push({before,cands,best:-1});break;}
    clusters=clusters.filter((c,i)=>i!==best);
    clusters.push({pts:bestSplit.child0,birth:birthCounter++});
    clusters.push({pts:bestSplit.child1,birth:birthCounter++});
    br.split_done++;
    out.push(hwSizes(clusters));
    rounds.push({before,cands,best,split:bestSplit,after:clusters.slice(),sizes:hwSizes(clusters)});
  }
  return {N,pts,rounds,out,br,final:clusters};
}

/* ---------- 画图工具 ---------- */
// 簇的颜色：下标 = birth % 8。K-means 里 0 号子簇用蓝色（1），1 号子簇用红色（2）
const HWC=['#59636E','#2451C4','#CF3528','#1E8E5A','#B07A00','#7A3FB8','#0E7C86','#C2408C'];
const HWINK='#1B2631',HWDIM='#AFB7BD';
const HWN='ABCDEFGHIJKLMNOP';
const hwF=v=>String(Math.round(v*100)/100);          // 数字显示：最多两位小数
const hwP=p=>`(${hwF(p.x)}, ${hwF(p.y)})`;
function hwTxt(r,x,y,html,fs,css){return H('div','a',Object.assign({left:x,top:y,fontSize:fs||30},css||{}),r,html);}
function hwHand(r,x,y,html,fs,css){return H('div','a hand',Object.assign({left:x,top:y,fontSize:fs||36},css||{}),r,html);}
function hwMono(r,x,y,html,fs,css){return H('div','a',Object.assign({left:x,top:y,fontSize:fs||30,fontFamily:'var(--mono)'},css||{}),r,html);}
// 依次出现：第 k 个元素在 t0 + gap·k 开始淡入
function hwSeq(list,t,t0,gap,dy){list.forEach((e,k)=>vis(e,ep(t,t0+gap*k,t0+gap*k+.6),dy==null?8:dy));}
// 在 [a, b] 之间为 1，两端各用 .4 秒淡入淡出
const hwWin=(t,a,b)=>Math.min(ep(t,a,a+.4),1-ep(t,b-.4,b));

// 坐标平面。o：{x, y 左上角；u 一格多少像素；xmax、ymax 坐标范围；tick 每隔几格标一个数}
function hwPlane(r,o){
  const W=o.u*o.xmax,HH=o.u*o.ymax,pad=30;
  H('div','a',{left:o.x-pad-18,top:o.y-pad,width:W+2*pad+18,height:HH+2*pad+14,background:'rgba(255,255,255,.8)',border:'1.5px solid rgba(27,38,49,.16)',borderRadius:'10px'},r);
  const svg=S('svg',{class:'ov'},r),X=v=>o.x+v*o.u,Y=v=>o.y+HH-v*o.u,g0=S('g',{},svg),tk=o.tick||1;
  for(let i=0;i<=o.xmax;i++){const l=S('line',{x1:X(i),y1:Y(0),x2:X(i),y2:Y(o.ymax)},g0);l.style.stroke=i?'#DDE3E6':'#66707A';l.style.strokeWidth=i?1.5:2.5;
    if(i%tk===0){const tx=S('text',{x:X(i),y:Y(0)+25,'text-anchor':'middle'},g0,String(i));tx.style.fill='#66707A';tx.style.fontSize='18px';}}
  for(let j=0;j<=o.ymax;j++){const l=S('line',{x1:X(0),y1:Y(j),x2:X(o.xmax),y2:Y(j)},g0);l.style.stroke=j?'#DDE3E6':'#66707A';l.style.strokeWidth=j?1.5:2.5;

  const ax=S('text',{x:X(o.xmax)+14,y:Y(0)+7},g0,'x');ax.style.fill='#66707A';ax.style.fontSize='20px';

'                bestSplit.gradNum, bestSplit.gradDen);',
'            if (cmp > 0) {',
'                bestIndex = i;',
'                bestSplit = cur;',
'            }',
'            else if (cmp == 0) {',
'                int curSize =',
'                    clusters[i].points.size();',
'                int bestSize =',
'                    clusters[bestIndex].points.size();',
'                if (curSize > bestSize) {',
'                    bestIndex = i;',
'                    bestSplit = cur;',
'                }',
'                else if (curSize == bestSize &&',
'                         clusters[i].birth <',
'                         clusters[bestIndex].birth) {',
'                    bestIndex = i;',
'                    bestSplit = cur;',
'                }',
'            }',
'        }',
'        if (bestIndex == -1) {',
'            break;',
'        }',
'        clusters.erase(',
'            clusters.begin() + bestIndex',
'        );',
'        clusters.push_back({',
'            bestSplit.child0,',
'            birthCounter++',
'        });',
'        clusters.push_back({',
'            bestSplit.child1,',
'            birthCounter++',
'        });',
'        printClusterSizes(clusters);',
'    }',
'    return 0;',
'}'];

function e4Scene(o){
  const x=80,w=o.w||800,nx=x+w+60;

    c.notes=o.steps.map(s=>{const g=H('div','a',{left:nx,top:132,width:1920-nx-80,opacity:0,whiteSpace:'normal'},r);
      H('div','',{fontFamily:'var(--display)',fontWeight:900,fontSize:42,lineHeight:1.3,marginBottom:'22px'},g,s.head);
      (s.body||[]).forEach(b=>H('div','',{fontSize:29,lineHeight:1.62,marginBottom:'14px'},g,b));return g;});
    return c;
  },
  update(c,t){
    let k=0;o.steps.forEach((s,i)=>{if(t>=s.t)k=i;});
    const s=o.steps[k],p=k?o.steps[k-1]:s;
    c.code.scroll(lerp(p.top||0,s.top||0,ep(t,s.t,s.t+.8)));
    if(s.hl)c.code.set(s.hl[0],s.hl[1]);else c.code.set(null);
    c.notes.forEach((g,i)=>vis(g,i===k?ep(t,s.t+.15,s.t+.7):0,8));
  }});
}

/* ================= 时间轴 ================= */
let TOTAL=0;SC.forEach(s=>{s.t0=TOTAL;TOTAL+=s.dur;});
const CAPS=[];SC.forEach(s=>s.caps.forEach(([a,b,x])=>CAPS.push([s.t0+a,s.t0+b,x])));
const stage=document.getElementById('stage'),sceneEl=document.getElementById('scene'),chap=document.getElementById('chap');
const capEl=document.getElementById('cap'),capSpan=capEl.firstElementChild,progFill=document.getElementById('progFill');
SC.forEach((s,i)=>{if(i)H('div','tick',{left:s.t0/TOTAL*1920-1},document.getElementById('prog'));});
let cur=-1,ctx=null;
function seek(t){
  t=clamp(t,0,TOTAL-1e-3);
  const i=SC.findIndex(s=>t<s.t0+s.dur),s=SC[i],lt=t-s.t0;
  if(i!==cur){sceneEl.innerHTML='';cur=i;ctx=s.build(sceneEl);chap.textContent=`${String(i+1).padStart(2,'0')} / ${String(SC.length).padStart(2,'0')}　${s.title}`;}
  const fin=i===SC.length-1?1:1-pr(lt,s.dur-.45,s.dur);
  sceneEl.style.opacity=Math.min(pr(lt,0,.45),fin);
  s.update(ctx,lt);
  const cp=CAPS.find(c=>t>=c[0]&&t<c[1]);
  if(cp){if(capSpan.textContent!==cp[2])capSpan.textContent=cp[2];capEl.style.opacity=Math.min(pr(t,cp[0],cp[0]+.25),1-pr(t,cp[1]-.25,cp[1]));}
  else capEl.style.opacity=0;
  progFill.style.width=(t/TOTAL*100)+'%';
  return i;
}
window.__seek=seek;window.__total=TOTAL;

/* ================= 播放器 ================= */
const wrap=document.getElementById('wrap'),holder=document.getElementById('holder');
function fit(){
  const sc=CAPTURE?1:Math.min(wrap.clientWidth/1920,wrap.clientHeight/1080);
  holder.style.width=1920*sc+'px';holder.style.height=1080*sc+'px';stage.style.transform=`scale(${sc})`;
}
fit();addEventListener('resize',fit);
if(CAPTURE){
  const m=location.search.match(/[?&]t=([\d.]+)/);seek(m?+m[1]:0);
  return;
}
const playBtn=document.getElementById('play'),timeEl=document.getElementById('time'),seekEl=document.getElementById('seek');
const speedBtn=document.getElementById('speed'),chapWrap=document.getElementById('chapters');
const ICON_PLAY='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>';
seekEl.max=TOTAL;
const chapBtns=SC.map((s,i)=>{const b=H('button',null,null,chapWrap,`${i+1} ${s.title}`);b.addEventListener('click',()=>{T=s.t0+.01;});return b;});
const speeds=[1,1.25,1.5,.75];let si=0;
let playing=true,T=0,last=null,dragging=false,shownIcon=null;
const mmss=x=>{x=Math.max(0,Math.floor(x));return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');};
function toggle(){if(T>=TOTAL-.05)T=0;playing=!playing;}
playBtn.addEventListener('click',toggle);
stage.addEventListener('click',toggle);
speedBtn.addEventListener('click',()=>{si=(si+1)%speeds.length;speedBtn.textContent=speeds[si]+'×';});
seekEl.addEventListener('input',()=>{T=+seekEl.value;dragging=true;});
seekEl.addEventListener('change',()=>{dragging=false;});
addEventListener('keydown',e=>{
  if(e.target===seekEl&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;
  if(e.key===' '){e.preventDefault();toggle();}
  else if(e.key==='ArrowLeft')T=Math.max(0,T-5);
  else if(e.key==='ArrowRight')T=Math.min(TOTAL,T+5);
  else if(/^[1-9]$/.test(e.key)&&SC[+e.key-1])T=SC[+e.key-1].t0+.01;
});
function frame(now){
  if(last!==null&&playing&&!dragging){T+=(now-last)/1000*speeds[si];if(T>=TOTAL){T=TOTAL;playing=false;}}
  last=now;
  const i=seek(T);
  if(!dragging)seekEl.value=T;
  timeEl.textContent=mmss(T)+' / '+mmss(TOTAL);
  const want=playing?'pause':'play';
  if(shownIcon!==want){playBtn.innerHTML=playing?ICON_PAUSE:ICON_PLAY;shownIcon=want;}
  chapBtns.forEach((b,k)=>b.classList.toggle('on',k===i));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
