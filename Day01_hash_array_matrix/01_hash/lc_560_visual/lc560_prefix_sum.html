<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LC560 前缀和讲解</title>
<!-- 本地直接双击打开即可播放；不依赖网络。空格 播放/暂停，← → 快退/快进 5 秒，数字键 1-9 跳章节。 -->
<style>
/* 版式：作业本方格纸 + 蓝色圆珠笔 + 红笔批改 + 黄色荧光笔；1920×1080 固定舞台，按窗口等比缩放 */
:root{
  --paper:#F4F5F0; --gridA:#E5E9EA; --gridB:#D6DDE1;
  --ink:#1B2631; --graphite:#66707A; --faint:#AFB7BD; --card:rgba(255,255,255,.64);
  --blue:#2451C4; --blue-soft:rgba(36,81,196,.09);
  --red:#CF3528; --marker:#FFE14D;
  --display:"Noto Serif SC","Source Han Serif SC","STSong",serif;
  --body:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
  --hand:"KaiTi","STKaiti","楷体",serif;
  --mono:"Cascadia Mono","Maple Mono NF CN",Consolas,monospace;
  --num:"Bahnschrift","DIN Alternate","Segoe UI",sans-serif;
  --chrome:#1D2125; --chrome-line:#383E44; --chrome-fg:#E6E8EA; --chrome-dim:#97A0A8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--chrome);overflow:hidden}
#wrap{position:absolute;left:0;right:0;top:0;bottom:64px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#holder{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background-color:var(--paper);
  background-image:linear-gradient(var(--gridB) 1px,transparent 1px),linear-gradient(90deg,var(--gridB) 1px,transparent 1px),
    linear-gradient(var(--gridA) 1px,transparent 1px),linear-gradient(90deg,var(--gridA) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;background-position:-1px -1px;
  font-family:var(--body);color:var(--ink);cursor:pointer}
body.capture #wrap{bottom:0} body.capture #bar{display:none} body.capture #stage{cursor:default}
#scene{position:absolute;inset:0}
.a{position:absolute;white-space:nowrap}
.cell{position:absolute;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);background:rgba(255,255,255,.72);
  font-family:var(--num);border-radius:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ghost{position:absolute;border:1.5px dashed var(--faint);border-radius:5px}
.idx{font-family:var(--mono);color:var(--graphite);text-align:center}
.hand{font-family:var(--hand);color:var(--red)}
.mk{position:absolute;background:var(--marker);mix-blend-mode:multiply;border-radius:8px}
.dot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--blue)}
.card{position:absolute;background:var(--card);border:1.5px solid rgba(27,38,49,.16);border-radius:10px}
.code{position:absolute;background:rgba(255,255,255,.74);border:1.5px solid rgba(27,38,49,.18);border-radius:8px;padding:16px 24px 20px;font-family:var(--mono);color:var(--ink)}
.code-title{font-family:var(--body);font-size:20px;color:var(--graphite);letter-spacing:.06em;margin-bottom:8px;line-height:1.5}
.code .cl{white-space:pre;position:relative}
.code-hl{position:absolute;left:12px;right:12px;background:var(--marker);mix-blend-mode:multiply;border-radius:4px;opacity:0}
.kw{color:var(--blue)}
svg.ov{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible;pointer-events:none}
svg text{font-family:var(--mono)}
svg circle,svg path,svg line{transform-box:fill-box;transform-origin:center}
.lv{stroke:var(--gridB);stroke-width:1.5}
.lv.zero{stroke:var(--faint);stroke-width:2}
.lvl{fill:var(--graphite);font-size:20px}
.seg{stroke:var(--blue);stroke-width:4;stroke-linecap:round;fill:none}
.pt{fill:var(--blue);stroke:var(--paper);stroke-width:3}
.pt.virt{fill:var(--paper);stroke:var(--blue);stroke-width:3.5}
.pv{fill:var(--blue);font-family:var(--num);font-size:22px;text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}
.halo{paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}
.target{stroke:var(--red);stroke-width:2.5;stroke-dasharray:9 7}
.ring{fill:none;stroke:var(--blue);stroke-width:3}
.hs{font-family:var(--hand);fill:var(--red);font-size:26px}
#hdr,#chap{position:absolute;top:42px;font-size:22px;color:var(--graphite);letter-spacing:.06em}
#hdr{left:96px} #chap{right:96px;text-align:right}
#hdr b{color:var(--ink);font-weight:600}
#cap{position:absolute;left:120px;right:120px;bottom:40px;text-align:center;pointer-events:none}
#cap span{display:inline-block;max-width:1640px;font-size:34px;line-height:1.55;padding:10px 26px;background:rgba(244,245,240,.95);
  border-radius:6px;color:var(--ink);text-wrap:balance;box-shadow:0 0 0 1px rgba(27,38,49,.08)}
#prog{position:absolute;left:0;bottom:0;height:5px;width:100%;background:var(--gridB)}
#progFill{height:100%;background:var(--ink);width:0}
.tick{position:absolute;top:0;width:3px;height:5px;background:var(--paper)}

#bar{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;color:var(--chrome-fg);font:14px var(--body)}
#bar button{background:none;border:1px solid var(--chrome-line);color:var(--chrome-fg);border-radius:6px;height:34px;padding:0 12px;font:inherit;cursor:pointer;flex:none}
#bar button:hover{border-color:#6A737C}
#bar button:focus-visible,#seek:focus-visible{outline:2px solid var(--marker);outline-offset:2px}
#play{width:46px;display:flex;align-items:center;justify-content:center}
#play svg{width:16px;height:16px;fill:currentColor}
#time{font-variant-numeric:tabular-nums;color:var(--chrome-dim);flex:none;min-width:98px}
#seek{flex:1;min-width:80px;accent-color:#F2D24B}
#chapters{display:flex;gap:6px;overflow-x:auto;max-width:52%;flex:none;scrollbar-width:none}
#chapters button{height:28px;padding:0 8px;font-size:12px;color:var(--chrome-dim);white-space:nowrap}
#chapters button.on{color:var(--chrome-fg);border-color:#F2D24B}
@media (max-width:900px){#chapters{display:none}}
@media (prefers-reduced-motion:reduce){#cap span{transition:none}}
</style>
</head>
<body>
<div id="wrap"><div id="holder"><div id="stage">
  <div id="hdr"><b>LC 560</b>　和为 K 的子数组</div>
  <div id="chap"></div>
  <div id="scene"></div>
  <div id="cap"><span></span></div>
  <div id="prog"><div id="progFill"></div></div>
</div></div></div>
<div id="bar">
  <button id="play" aria-label="播放或暂停"></button>
  <span id="time">00:00 / 00:00</span>
  <input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放进度">
  <div id="chapters"></div>
  <button id="speed" aria-label="播放速度">1×</button>
</div>
<script>
(function(){
const CAPTURE=/capture/.test(location.search);
if(CAPTURE)document.body.classList.add('capture');

/* ---------- 数据：全程用同一个例子 ---------- */
const NUMS=[1,2,-2,2,1,2],K=3,N=NUMS.length;
const PRE=[0];NUMS.forEach(v=>PRE.push(PRE[PRE.length-1]+v));
const P=i=>PRE[i+1];                       // P(-1)=0 是空前缀
const fmt=v=>v<0?'−'+(-v):String(v);
const par=v=>v<0?'('+fmt(v)+')':String(v);

/* ---------- 小工具 ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eout=x=>1-Math.pow(1-x,3);
const pr=(t,a,b)=>clamp((t-a)/(b-a));
const ep=(t,a,b)=>ease(pr(t,a,b));
const lerp=(a,b,p)=>a+(b-a)*p;
const INK=[27,38,49],BLUE=[36,81,196],GRAY=[175,183,189];
const mix=(a,b,p)=>`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*p)).join(',')})`;
const NOPX={opacity:1,zIndex:1,fontWeight:1,lineHeight:1,flex:1};
function H(tag,cls,css,parent,html){
  const e=document.createElement(tag);if(cls)e.className=cls;
  if(css)for(const k in css)e.style[k]=(typeof css[k]==='number'&&!NOPX[k])?css[k]+'px':css[k];
  if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e;
}
const SVGNS='http://www.w3.org/2000/svg';
function S(tag,attrs,parent,text){
  const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);
  if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e;
}
function vis(e,a,dy=0,dx=0){e.style.opacity=a;e.style.transform=(dy||dx)?`translate(${(1-a)*dx}px,${(1-a)*dy}px)`:'';}
function pop(e,a){e.style.opacity=a;e.style.transform=`scale(${.82+.18*a})`;}
function drawable(el){
  const len=el.getTotalLength();el.style.strokeDasharray=len+' '+(len+4);el.style.strokeDashoffset=len;
  return {el,len,set(p){el.style.strokeDashoffset=len*(1-p);el.style.opacity=p>0?1:0;}};
}
// 手画的红笔圈：略微超过一圈、带一点倾斜
function penCircle(g,cx,cy,a,b,color,w=3.2,rot=-9){
  let d='',len=0,px=0,py=0;const n=72,turns=1.1,r=rot*Math.PI/180;
  for(let k=0;k<=n;k++){
    const th=-Math.PI*.62+k/n*turns*2*Math.PI,gr=1+.07*k/n;
    const x=a*gr*Math.cos(th),y=b*gr*Math.sin(th);
    const X=cx+x*Math.cos(r)-y*Math.sin(r),Y=cy+x*Math.sin(r)+y*Math.cos(r);
    d+=(k?'L':'M')+X.toFixed(1)+' '+Y.toFixed(1);if(k)len+=Math.hypot(X-px,Y-py);px=X;py=Y;
  }
  const el=S('path',{d,fill:'none'},g);
  Object.assign(el.style,{stroke:color,strokeWidth:w,strokeLinecap:'round',strokeLinejoin:'round',strokeDasharray:len+' '+(len+4),strokeDashoffset:len,opacity:0});
  return {el,len,set(p){el.style.strokeDashoffset=len*(1-p);el.style.opacity=p>0?1:0;}};
}
// 方括号：一条括号 = 一段子数组
function bracket(svg,x1,x2,y,color,label,dir=1,fs=20){
  const g=S('g',{},svg);
  const p=S('path',{d:`M${x1} ${y-8*dir} L${x1} ${y} L${x2} ${y} L${x2} ${y-8*dir}`,fill:'none'},g);
  Object.assign(p.style,{stroke:color,strokeWidth:3.5,strokeLinecap:'round',strokeLinejoin:'round'});
  const d=drawable(p);let tx=null;
  if(label){tx=S('text',{x:x2+12,y:y+7,class:'halo'},g,label);tx.style.fill=color;tx.style.fontSize=fs+'px';tx.style.opacity=0;}
  return {g,d,t:tx,set(pp,lp=pp){d.set(pp);if(tx)tx.style.opacity=lp;}};
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const KW=/\b(int|for|while|if|return|auto|unordered_map|vector)\b/g;
function codePanel(r,x,y,lines,fs,lh,title){
  const box=H('div','code',{left:x,top:y,fontSize:fs,lineHeight:lh+'px'},r);
  if(title)H('div','code-title',null,box,title);
  const hl=H('div','code-hl',{height:lh},box);
  const els=lines.map(l=>H('div','cl',null,box,l?esc(l).replace(KW,'<span class="kw">$1</span>'):' '));
  let cur;
  return {box,els,set(i){
    if(i===cur)return;cur=i;
    if(i==null){hl.style.opacity=0;}else{hl.style.opacity=.95;hl.style.top=els[i].offsetTop+'px';}
  }};
}
function arrayRow(r,x0,y,w,h,pitch,fs,withIdx=true,ifs=20){
  const cells=NUMS.map((v,i)=>H('div','cell',{left:x0+pitch*i,top:y,width:w,height:h,fontSize:fs},r,fmt(v)));
  const idx=withIdx?NUMS.map((v,i)=>H('div','a idx',{left:x0+pitch*i,top:y+h+6,width:w,fontSize:ifs},r,String(i))):[];
  return {cells,idx};
}
// 前缀和折线：横轴下标 -1..N-1，纵轴 P
function buildChart(svg,c){
  const G={lv:[]};const R=c.r||10;
  const grid=S('g',{},svg);
  for(let p=c.lo;p<=c.hi;p++){
    const yy=c.y(p),g=S('g',{},grid);
    S('line',{x1:c.gx0,x2:c.gx1,y1:yy,y2:yy,class:p===0?'lv zero':'lv'},g);
    S('text',{x:c.gx0-12,y:yy+7,class:'lvl','text-anchor':'end'},g,fmt(p));
    G.lv.push(g);
  }
  G.under=S('g',{},svg);
  G.segs=[];for(let i=0;i<N;i++)G.segs.push(drawable(S('line',{x1:c.x(i-1),y1:c.y(P(i-1)),x2:c.x(i),y2:c.y(P(i)),class:'seg'},svg)));
  G.mid=S('g',{},svg);
  G.pts=[];G.vals=[];
  for(let i=-1;i<N;i++){
    G.pts.push(S('circle',{cx:c.x(i),cy:c.y(P(i)),r:R,class:i<0?'pt virt':'pt'},svg));
    G.vals.push(S('text',{x:c.x(i),y:c.y(P(i))-R-15,class:'pv'},svg,fmt(P(i))));
  }
  G.top=S('g',{},svg);
  return G;
}

const BRUTE=[
'int subarraySum(vector<int>& nums, int k) {',
'    int n = nums.size();',
'    int count = 0;',
'    for (int i = 0; i < n; i++) {',
'        int temp_sum = 0;',
'        int j = i;',
'        while (j < n) {',
'            temp_sum += nums[j];',
'            j++;',
'            if (temp_sum == k)',
'                count++;',
'        }',
'    }',
'    return count;',
'}'];
const OPT=[
'int subarraySum(vector<int>& nums, int k) {',
'    int n = nums.size();',
'    int count = 0;',
'    int temp_sum = 0;',
'    unordered_map<int, int> freq;',
'    freq[0] = 1;',
'',
'    for (int i = 0; i < n; i++) {',
'        temp_sum += nums[i];',
'        auto it = freq.find(temp_sum - k);',
'        if (it != freq.end()) {',
'            count += it->second;',
'        }',
'        freq[temp_sum]++;',
'    }',
'    return count;',
'}'];

/* ================= 场景 ================= */
const SC=[];

/* 1 题目 */
SC.push({title:'题目',dur:10,caps:[
  [.5,5.2,'题目：数组里有多少段连续子数组，和恰好等于 k？'],
  [5.4,9.7,'例子：nums = [1, 2, −2, 2, 1, 2]，k = 3。答案是 6 段，就是下面这 6 条红线。']],
build(r){
  const c={};
  c.eb=H('div','a',{left:164,top:190,fontFamily:'var(--mono)',fontSize:30,color:'var(--graphite)',letterSpacing:'.04em'},r,'LeetCode 560 · 哈希 / 前缀和');
  c.ti=H('div','a',{left:154,top:236,fontFamily:'var(--display)',fontSize:124,fontWeight:900,letterSpacing:'.02em',lineHeight:1.2},r,'和为 K 的子数组');
  c.sub=H('div','a',{left:164,top:416,fontSize:38},r,'原来的双重循环，是怎么一步步变成 <b style="color:var(--blue)">前缀和 + 哈希表</b> 的');
  c.arr=arrayRow(r,164,556,120,120,136,56,true,24);
  c.k=H('div','a',{left:1036,top:570,fontFamily:'var(--num)',fontSize:88,color:'var(--red)',lineHeight:1.1},r,'k = 3');
  c.svg=S('svg',{class:'ov'},r);
  const ans=[[0,1],[0,3],[1,4],[3,4],[2,5],[4,5]];
  c.br=ans.map(([a,b],n)=>bracket(c.svg,164+136*a+12,164+136*b+108,736+n*22,'var(--red)',null,1));
  c.note=H('div','a hand',{left:1010,top:770,fontSize:38},r,'一共 6 段');
  return c;
},
update(c,t){
  vis(c.eb,ep(t,.2,.9),16);vis(c.ti,ep(t,.35,1.2),24);vis(c.sub,ep(t,.9,1.7),16);
  c.arr.cells.forEach((e,i)=>pop(e,ep(t,1.7+.12*i,2.2+.12*i)));
  c.arr.idx.forEach((e,i)=>e.style.opacity=ep(t,1.9+.12*i,2.4+.12*i));
  vis(c.k,ep(t,2.7,3.3),0,-24);
  c.br.forEach((b,n)=>b.set(ep(t,5.8+.4*n,6.3+.4*n)));
  vis(c.note,ep(t,8.4,9),10);
}});

/* 2 原来的写法 */
SC.push({title:'原来的写法',dur:28,caps:[
  [.3,5.5,'你的写法：先固定起点 i，j 往右走，边走边把 nums[j] 加进 temp_sum。'],
  [5.7,10.5,'右边每一格是一段 nums[i..j] 的和。画红圈的，是和等于 3 的格子。'],
  [10.7,15.2,'注意每一行的开头：一换起点，temp_sum 就归零，前面加过的全部作废。'],
  [15.4,21.5,'6 个数一共 6×7/2 = 21 格，每格一次加法。n 个数就是 n(n+1)/2 格，也就是 O(n²)。'],
  [21.7,27.6,'可 21 格里只有 6 格是答案。能不能不一格一格地试？']],
build(r){
  const c={};
  c.code=codePanel(r,96,140,BRUTE,25,42,'你的原始写法');
  c.arr=arrayRow(r,1010,160,96,84,108,40,true,20);
  H('div','a idx',{left:928,top:186,fontSize:24,textAlign:'left'},r,'j →');
  c.mk=H('div','mk',{left:0,top:150,width:0,height:104,opacity:0},r);
  c.st=H('div','a',{left:930,top:290,fontFamily:'var(--mono)',fontSize:28},r,'');
  c.svg=S('svg',{class:'ov'},r);
  c.steps=[];c.cells=[];c.circ=[];c.rowNote=[];c.rowK0=[];
  for(let i=0;i<N;i++){
    const y=350+72*i;
    H('div','a idx',{left:922,top:y+16,fontSize:22,textAlign:'left'},r,'i = '+i);
    c.rowK0.push(c.steps.length);
    c.rowNote.push(i>0?H('div','a hand',{left:1010+108*i-96,top:y+13,width:82,textAlign:'right',fontSize:28,opacity:0},r,'归零'):null);
    for(let j=i;j<N;j++){
      const sum=P(j)-P(i-1),hit=sum===K,x=1010+108*j;
      H('div','ghost',{left:x,top:y,width:96,height:60},r);
      const cell=H('div','cell',{left:x,top:y,width:96,height:60,fontSize:30,opacity:0},r,fmt(sum));
      if(hit)cell.style.color='var(--red)';
      c.steps.push({i,j,sum,hit});c.cells.push(cell);
      c.circ.push(hit?penCircle(c.svg,x+48,y+30,56,37,'var(--red)',3.4):null);
    }
  }
  c.cL=H('div','a',{left:1690,top:350,fontSize:22,color:'var(--graphite)'},r,'count');
  c.cV=H('div','a',{left:1686,top:378,fontFamily:'var(--num)',fontSize:76,color:'var(--red)',lineHeight:1},r,'0');
  c.aL=H('div','a',{left:1690,top:498,fontSize:22,color:'var(--graphite)'},r,'加法次数');
  c.aV=H('div','a',{left:1686,top:526,fontFamily:'var(--num)',fontSize:76,lineHeight:1},r,'0');
  c.n1=H('div','a hand',{left:1010,top:788,fontSize:36},r,'6×7/2 = 21 格');
  c.n2=H('div','a hand',{left:1290,top:788,fontSize:36},r,'只有 6 格是答案');
  c.n3=H('div','a hand',{left:100,top:852,fontSize:34},r,'两层循环 → O(n²)');
  return c;
},
update(c,t){
  c.arr.cells.forEach((e,i)=>pop(e,ep(t,.3+.06*i,.7+.06*i)));
  c.arr.idx.forEach((e,i)=>e.style.opacity=ep(t,.4+.06*i,.8+.06*i));
  const T0=3.5,SD=.55,M=c.steps.length,f=(t-T0)/SD,s=Math.floor(f),ph=f-s;
  let count=0,adds=0;
  c.steps.forEach((st,k)=>{
    const a=k<s?1:k===s?eout(clamp(ph/.3)):0;
    const dim=st.hit?1:1-.6*ep(t,21.8,22.8);
    c.cells[k].style.opacity=a*dim;c.cells[k].style.transform=`scale(${.86+.14*a})`;
    if(st.hit){c.circ[k].set(k<s?1:k===s?ep(ph,.5,.95):0);if(k<s||(k===s&&ph>.6))count++;}
    if(k<s||(k===s&&ph>.08))adds++;
  });
  c.rowNote.forEach((e,i)=>{if(e)vis(e,ep(t,T0+c.rowK0[i]*SD,T0+c.rowK0[i]*SD+.3),0,10);});
  let line=null;
  if(s>=0&&s<M){

function fit(){
  const sc=CAPTURE?1:Math.min(wrap.clientWidth/1920,wrap.clientHeight/1080);
  holder.style.width=1920*sc+'px';holder.style.height=1080*sc+'px';stage.style.transform=`scale(${sc})`;
}
fit();addEventListener('resize',fit);
if(CAPTURE){
  const m=location.search.match(/[?&]t=([\d.]+)/);seek(m?+m[1]:0);
  return;
}
const playBtn=document.getElementById('play'),timeEl=document.getElementById('time'),seekEl=document.getElementById('seek');
const speedBtn=document.getElementById('speed'),chapWrap=document.getElementById('chapters');
const ICON_PLAY='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>';
seekEl.max=TOTAL;
const chapBtns=SC.map((s,i)=>{const b=H('button',null,null,chapWrap,`${i+1} ${s.title}`);b.addEventListener('click',()=>{T=s.t0+.01;});return b;});
const speeds=[1,1.25,1.5,.75];let si=0;
let playing=true,T=0,last=null,dragging=false,shownIcon=null;
const mmss=x=>{x=Math.max(0,Math.floor(x));return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');};
function toggle(){if(T>=TOTAL-.05)T=0;playing=!playing;}
playBtn.addEventListener('click',toggle);
stage.addEventListener('click',toggle);
speedBtn.addEventListener('click',()=>{si=(si+1)%speeds.length;speedBtn.textContent=speeds[si]+'×';});
seekEl.addEventListener('input',()=>{T=+seekEl.value;dragging=true;});
seekEl.addEventListener('change',()=>{dragging=false;});
addEventListener('keydown',e=>{
  if(e.target===seekEl&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;
  if(e.key===' '){e.preventDefault();toggle();}
  else if(e.key==='ArrowLeft')T=Math.max(0,T-5);
  else if(e.key==='ArrowRight')T=Math.min(TOTAL,T+5);
  else if(/^[1-9]$/.test(e.key)&&SC[+e.key-1])T=SC[+e.key-1].t0+.01;
});
function frame(now){
  if(last!==null&&playing&&!dragging){T+=(now-last)/1000*speeds[si];if(T>=TOTAL){T=TOTAL;playing=false;}}
  last=now;
  const i=seek(T);
  if(!dragging)seekEl.value=T;
  timeEl.textContent=mmss(T)+' / '+mmss(TOTAL);
  const want=playing?'pause':'play';
  if(shownIcon!==want){playBtn.innerHTML=playing?ICON_PAUSE:ICON_PLAY;shownIcon=want;}
  chapBtns.forEach((b,k)=>b.classList.toggle('on',k===i));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
